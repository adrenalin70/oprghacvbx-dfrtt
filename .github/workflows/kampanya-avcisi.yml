name: Kampanya Avcısı

on:
  schedule:
    # 15 dakikada bir. Saat başları GitHub'da en yoğun anlar olduğu için 7, 22, 37 ve 52. dakikalar seçildi.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece Telegram/Gmail bağlantı testi yap"
        type: boolean
        default: false

permissions:
  contents: write # state.json dosyasını kaydedebilmek için

concurrency:
  group: kampanya-avcisi
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Kampanyaları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 watcher.py ${{ inputs.test && '--test' || '' }}

      - name: Hafızayı kaydet
        if: ${{ !inputs.test }}
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "kampanya-avcisi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Kampanya hafızası güncellendi"
          git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
